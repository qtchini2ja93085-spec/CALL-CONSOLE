name: Build CALLCONSOLE Android APK v75

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-android-v75:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore baseline
        run: |
          set -e
          rm -rf /tmp/callconsole www
          mkdir -p /tmp/callconsole
          unzip -q CALLCONSOLE-ANDROID-CAPACITOR-PROJECT.zip -d /tmp/callconsole
          SOURCE_DIR="$(find /tmp/callconsole -type f -path '*/www/index.html' -print -quit | xargs dirname)"
          test -n "$SOURCE_DIR"
          cp -R "$SOURCE_DIR" www
          test -f www/index.html

      - name: Apply AERO integration and mobile role suggestion fix
        run: |
          set -e
          cp build-assets/callconsole-ai-engine.js www/ai-engine.js
          cp build-assets/callconsole-script-modes.js www/script-modes.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('www/script-modes.js')
          s=p.read_text(encoding='utf-8')
          start=s.find('const rolePresets=')
          end=s.find('function setBusy', start if start >= 0 else 0)
          if start >= 0 and end >= 0:
              s=s[:start]+s[end:]
          s=re.sub(r"if\(!document\.getElementById\(['\"]aero-role-presets['\"]\)\)\s*addRolePresets\s*\(\s*\)\s*;",'',s)
          s=s.replace('portalQuickObjectionCard();syncRolePresentation();addRolePresets();','portalQuickObjectionCard();syncRolePresentation();')
          s=re.sub(r'addRolePresets\s*\(\s*\)\s*;','',s)
          s=s.replace('aero-role-presets','role-presets-disabled')
          s=s.replace('https://intelligent-outreach-builder.vercel.app/api/callconsole-ai','https://intelligent-outreach-builder.vercel.app/api/callconsole-ai-fast')
          p.write_text(s,encoding='utf-8')

          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<div\b[^>]*\bid=["\']aero-role-presets["\'][^>]*>.*?</div>\s*','',s,count=1,flags=re.S|re.I)
          marker='<!-- V22 End-to-End QA: context-aware Coach, workflow duration, CRM sync, quick-outcome state fixes -->'
          if marker not in s: raise SystemExit('coach marker missing')
          s=re.sub(r'<script\b[^>]*src=["\'][^"\']*ai-engine\.js[^"\']*["\'][^>]*>\s*</script\s*>','',s,flags=re.S|re.I)
          s=re.sub(r'<script\b[^>]*src=["\'][^"\']*script-modes\.js[^"\']*["\'][^>]*>\s*</script\s*>','',s,flags=re.S|re.I)
          inject='''<script src="./ai-engine.js"></script>
          <script src="./script-modes.js"></script>
          <style id="aero-role-suggest-style">
            .aero-role-suggest-wrap{position:relative;width:100%;z-index:99990}
            .aero-role-suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);display:none;max-height:280px;overflow-y:auto;background:#111821;border:1px solid rgba(91,111,145,.75);border-radius:14px;box-shadow:0 18px 42px rgba(0,0,0,.55);z-index:99999;padding:6px}
            .aero-role-suggest.open{display:block}
            .aero-role-option{display:block;width:100%;box-sizing:border-box;border:0;border-bottom:1px solid rgba(255,255,255,.10);background:transparent;color:#e9edf5;text-align:left;padding:12px 14px;font:inherit;font-size:16px;line-height:1.25;cursor:pointer;border-radius:9px}
            .aero-role-option:last-child{border-bottom:0}
            .aero-role-option:active,.aero-role-option.selected{background:rgba(35,190,200,.16);color:#7de8ed}
          </style>
          <script>
          (function(){
            var roles=['CFO','FVP Finance','SVP Finance','EVP Finance','VP Finance','AVP Finance','General Manager Finance and Administration','General Manager Operations','General Manager Commercial','General Manager Strategy','Head of FP&A','Head of Finance','Finance Director','Financial Controller','Head of Strategy','Strategy Director','Business Transformation Director','Head of Transformation','Head of Shared Services','COO / Operations','Chief Strategy Officer','Chief Transformation Officer','Chief Digital Officer','Chief Commercial Officer','Chief Revenue Officer','Head of Supply Chain','Chief Procurement Officer','Head of Treasury','Head of Performance Management','Workforce Planning Lead','Sales Operations Director','Revenue Operations Director','Head of Corporate Planning','Enterprise Performance / EPM Lead'];
            function installRoleSuggestions(){
              var role=document.getElementById('f-role'); if(!role)return;
              role.removeAttribute('list');
              var old=document.getElementById('aero-role-suggestions'); if(old)old.remove();
              var wrap=role.parentNode;
              if(!wrap)return;
              if(wrap.dataset.aeroRoleSuggestInstalled==='1')return;
              wrap.dataset.aeroRoleSuggestInstalled='1';
              wrap.classList.add('aero-role-suggest-wrap');
              var menu=document.createElement('div'); menu.id='aero-role-suggestions'; menu.className='aero-role-suggest'; menu.setAttribute('role','listbox');
              wrap.appendChild(menu);
              var selected=-1;
              function close(){menu.classList.remove('open');selected=-1;}
              function render(){
                var q=(role.value||'').trim().toLowerCase();
                var matches=roles.filter(function(v){return !q||v.toLowerCase().indexOf(q)>=0;}).slice(0,10);
                menu.innerHTML=''; selected=-1;
                if(!q||!matches.length){close();return;}
                matches.forEach(function(v,i){
                  var b=document.createElement('button'); b.type='button'; b.className='aero-role-option'; b.textContent=v; b.setAttribute('role','option');
                  b.addEventListener('mousedown',function(e){e.preventDefault();});
                  b.addEventListener('click',function(){role.value=v;role.dispatchEvent(new Event('input',{bubbles:true}));role.dispatchEvent(new Event('change',{bubbles:true}));close();role.focus();});
                  menu.appendChild(b);
                });
                menu.classList.add('open');
              }
              role.addEventListener('input',render);
              role.addEventListener('focus',function(){if((role.value||'').trim())render();});
              role.addEventListener('keydown',function(e){
                var items=menu.querySelectorAll('.aero-role-option'); if(!menu.classList.contains('open')||!items.length)return;
                if(e.key==='ArrowDown'){e.preventDefault();selected=(selected+1)%items.length;items.forEach(function(x){x.classList.remove('selected')});items[selected].classList.add('selected');items[selected].scrollIntoView({block:'nearest'});}
                else if(e.key==='ArrowUp'){e.preventDefault();selected=(selected-1+items.length)%items.length;items.forEach(function(x){x.classList.remove('selected')});items[selected].classList.add('selected');items[selected].scrollIntoView({block:'nearest'});}
                else if(e.key==='Enter'&&selected>=0){e.preventDefault();items[selected].click();}
                else if(e.key==='Escape'){close();}
              });
              role.addEventListener('blur',function(){setTimeout(close,180);});
            }
            installRoleSuggestions();
            new MutationObserver(installRoleSuggestions).observe(document.body,{childList:true,subtree:true});
          })();
          </script>
          '''
          s=s.replace(marker,inject+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check www/script-modes.js
          node --check www/ai-engine.js

      - name: QA generated web app
        run: |
          set -e
          ! grep -q 'aero-role-presets' www/script-modes.js
          ! grep -q 'addRolePresets' www/script-modes.js
          ! grep -q '<datalist' www/index.html
          grep -q 'aero-role-suggestions' www/index.html
          grep -q 'callconsole-ai-fast' www/script-modes.js
          grep -q 'data-mode="auto"' www/script-modes.js
          grep -q 'data-mode="ai"' www/script-modes.js
          grep -q 'data-mode="local"' www/script-modes.js
          grep -q 'quick-obj-card' www/script-modes.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('www/script-modes.js','utf8');
          const a=(ok,m)=>{if(!ok)throw new Error(m)};
          a(s.includes('localBaselineHTML'),'HTML baseline missing');
          a(s.includes('restoreBaseline()'),'restore baseline missing');
          a(s.includes('applyReplacementsToStyledBaseline'),'styled surgical replacement missing');
          a(!s.includes('setScriptText(d.script)'),'plain AI script replacement detected');
          a(s.includes('Array.isArray(d.replacements)'),'replacement validation missing');
          a(s.includes("host.dataset.aeroBound==='1'"),'binding guard missing');
          console.log('v75 QA: PASS');
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Fast AI tailoring smoke test
        continue-on-error: true
        run: |
          node - <<'NODE'
          const endpoint='https://intelligent-outreach-builder.vercel.app/api/callconsole-ai-fast';
          const original='Hi, may I take 30 seconds to understand how your team currently handles planning and reporting?';
          const payload={task:'script_tailoring',prospect:'Smoke Test Prospect',company:'Smoke Test Co',role:'Business Transformation Director',department:'Transformation',product:'Jedox',research:'Test-only research. Keep claims cautious.',localScript:original};
          const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),10000);
          try{
            const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ctl.signal});
            const d=JSON.parse(await r.text());
            if(!r.ok||!d.script||!Array.isArray(d.replacements))throw new Error('fast endpoint contract failed');
            let out=original;
            for(const x of d.replacements){if(!x.find||out.indexOf(x.find)<0)throw new Error('invalid replacement');out=out.replace(x.find,String(x.replace??''));}
            if(out!==d.script)throw new Error('surgical output mismatch');
            console.log('Fast AI smoke:',JSON.stringify({source:d.source,model:d.model,replacements:d.replacements.length}));
          } finally {clearTimeout(t)}
          NODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CALLCONSOLE-Android-Debug-APK-v75
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
