name: Build CALLCONSOLE Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore known-good CALLCONSOLE baseline
        run: |
          set -e
          rm -rf /tmp/callconsole www
          mkdir -p /tmp/callconsole
          unzip -q CALLCONSOLE-ANDROID-CAPACITOR-PROJECT.zip -d /tmp/callconsole
          SOURCE_DIR="$(find /tmp/callconsole -type f -path '*/www/index.html' -print -quit | xargs dirname)"
          test -n "$SOURCE_DIR"
          cp -R "$SOURCE_DIR" www
          test -f www/index.html

      - name: Apply AI engine and CALLCONSOLE coach integration
        run: |
          set -e
          test -f build-assets/callconsole-ai-engine.js
          cp build-assets/callconsole-ai-engine.js www/ai-engine.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'function coachNextMove(){'
          if old not in s:
              raise SystemExit('Expected CALLCONSOLE coach function was not found')
          s = s.replace(old, 'function coachNextMoveLocal(){', 1)
          marker = '<!-- V22 End-to-End QA: context-aware Coach, workflow duration, CRM sync, quick-outcome state fixes -->'
          if marker not in s:
              raise SystemExit('Expected CALLCONSOLE injection marker was not found')
          inject = '''<script src="./ai-engine.js"></script>\n<script>\nasync function coachNextMove(){\n    const input=document.getElementById("live-coach-input");\n    const text=input?input.value.trim():"";\n    if(!text){showStatus("⚡ Enter what the prospect said first.");return;}\n    const research=((document.getElementById("f-research")||{}).value||"");\n    const role=((document.getElementById("f-role")||{}).value||"the team").trim();\n    const company=((document.getElementById("f-company")||{}).value||"").trim();\n    const prospect=((document.getElementById("f-prospect")||{}).value||"").trim();\n    const product=((document.getElementById("f-product")||{}).value||"Jedox").trim();\n    const ctx={prospect,company,role,product,research,prospectSaid:text};\n    const result=await window.CALLCONSOLE_AI.nextMove({...ctx,localFallback:()=>window.CALLCONSOLE_AI.localNextMove(ctx)});\n    const rEl=document.getElementById("live-coach-response");if(rEl)rEl.textContent=result.response;\n    const qEl=document.getElementById("live-coach-question");if(qEl)qEl.textContent=result.question;\n    const resEl=document.getElementById("live-coach-result");if(resEl)resEl.classList.add("open");\n    showStatus(result.source!=="offline"?"🧠 AI coaching applied.":"⚡ Offline coaching applied.");\n}\n</script>\n\n'''
          s=s.replace(marker,inject+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check www/ai-engine.js
          grep -q 'function coachNextMoveLocal' www/index.html
          grep -q 'function coachNextMove()' www/index.html
          grep -q 'CALLCONSOLE_AI.nextMove' www/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Smoke test live CALLCONSOLE AI endpoint
        run: |
          node - <<'NODE'
          const endpoint = 'https://intelligent-outreach-builder.vercel.app/api/callconsole-ai';
          const payload = {
            prospect: 'Smoke Test Prospect',
            company: 'Smoke Test Co',
            role: 'CFO',
            product: 'Jedox',
            research: 'Test-only validation request. Do not invent facts.',
            prospectSaid: 'We are interested, but we need to understand the timing.'
          };
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 20000);
          try {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
              signal: controller.signal
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${text}`);
            const data = JSON.parse(text);
            if (!data.response || !data.question) throw new Error('AI endpoint returned no response/question');
            if (data.source === 'fallback' || data.source === 'offline') throw new Error(`Live AI provider was not used (source=${data.source})`);
            console.log('CALLCONSOLE AI smoke test passed:', JSON.stringify({ source: data.source }));
          } finally {
            clearTimeout(timer);
          }
          NODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CALLCONSOLE-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
