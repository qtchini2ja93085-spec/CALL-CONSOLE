name: Build CALLCONSOLE Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore known-good CALLCONSOLE baseline
        run: |
          set -e
          rm -rf /tmp/callconsole www
          mkdir -p /tmp/callconsole
          unzip -q CALLCONSOLE-ANDROID-CAPACITOR-PROJECT.zip -d /tmp/callconsole
          SOURCE_DIR="$(find /tmp/callconsole -type f -path '*/www/index.html' -print -quit | xargs dirname)"
          test -n "$SOURCE_DIR"
          cp -R "$SOURCE_DIR" www
          test -f www/index.html

      - name: Apply AI engine and CALLCONSOLE coach integration
        run: |
          set -e
          test -f build-assets/callconsole-ai-engine.js
          test -f build-assets/callconsole-script-modes.js
          cp build-assets/callconsole-ai-engine.js www/ai-engine.js
          cp build-assets/callconsole-script-modes.js www/script-modes.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'function coachNextMove(){'
          if old not in s:
              raise SystemExit('Expected CALLCONSOLE coach function was not found')
          s = s.replace(old, 'function coachNextMoveLocal(){', 1)
          marker = '<!-- V22 End-to-End QA: context-aware Coach, workflow duration, CRM sync, quick-outcome state fixes -->'
          if marker not in s:
              raise SystemExit('Expected CALLCONSOLE injection marker was not found')
          inject = '''<script src="./ai-engine.js"></script>\n<script src="./script-modes.js"></script>\n<script>\nasync function coachNextMove(){\n    const input=document.getElementById("live-coach-input");\n    const text=input?input.value.trim():"";\n    if(!text){showStatus("⚡ Enter what the prospect said first.");return;}\n    const research=((document.getElementById("f-research")||{}).value||"");\n    const role=((document.getElementById("f-role")||{}).value||"the team").trim();\n    const company=((document.getElementById("f-company")||{}).value||"").trim();\n    const prospect=((document.getElementById("f-prospect")||{}).value||"").trim();\n    const product=((document.getElementById("f-product")||{}).value||"Jedox").trim();\n    const ctx={prospect,company,role,product,research,prospectSaid:text};\n    const result=await window.CALLCONSOLE_AI.nextMove({...ctx,localFallback:()=>window.CALLCONSOLE_AI.localNextMove(ctx)});\n    const rEl=document.getElementById("live-coach-response");if(rEl)rEl.textContent=result.response;\n    const qEl=document.getElementById("live-coach-question");if(qEl)qEl.textContent=result.question;\n    const resEl=document.getElementById("live-coach-result");if(resEl)resEl.classList.add("open");\n    showStatus(result.source!=="offline"?"🧠 AI coaching applied.":"⚡ Offline coaching applied.");\n}\n</script>\n\n'''
          s=s.replace(marker,inject+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check www/ai-engine.js
          node --check www/script-modes.js
          grep -q 'function coachNextMoveLocal' www/index.html
          grep -q 'function coachNextMove()' www/index.html
          grep -q 'CALLCONSOLE_AI.nextMove' www/index.html
          grep -q 'script-modes.js' www/index.html

      - name: AERO local intelligence regression tests
        run: |
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const source=fs.readFileSync('www/ai-engine.js','utf8');
          const sandbox={window:{},console,setTimeout,clearTimeout};
          vm.createContext(sandbox); vm.runInContext(source,sandbox);
          const ai=sandbox.window.CALLCONSOLE_AI;
          const assert=(ok,msg)=>{if(!ok)throw new Error('AERO QA: '+msg);};
          assert(ai.systemsFrom('SAP S/4HANA with Power BI and Excel').includes('SAP S/4HANA'),'SAP S/4HANA detection failed');
          assert(ai.systemsFrom('SAP S/4HANA with Power BI and Excel').includes('Power BI'),'Power BI detection failed');
          assert(!ai.systemsFrom('The landscape is complex and it is improving').includes('SAP'),'false-positive SAP detection');
          assert(ai.classify('We already use Anaplan today')==='existing_stack','existing-stack classification failed');
          assert(!ai.signals('It is fine; nothing to change').stakeholder,'false-positive stakeholder signal');
          assert(ai.signals('Our IT team owns the integration').stakeholder,'explicit IT stakeholder signal failed');
          assert(ai.classify('Please call me back next week')==='timing','timing classification failed');
          assert(ai.classify('We have no budget this year')==='budget','budget classification failed');
          console.log('AERO local intelligence regression: PASS');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Smoke test live CALLCONSOLE AI endpoint
        run: |
          node - <<'NODE'
          const endpoint = 'https://intelligent-outreach-builder.vercel.app/api/callconsole-ai';
          const payload = {
            prospect: 'Smoke Test Prospect',
            company: 'Smoke Test Co',
            role: 'CFO',
            product: 'Jedox',
            research: 'Test-only validation request. Do not invent facts.',
            prospectSaid: 'We are interested, but we need to understand the timing.'
          };
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 30000);
          try {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
              signal: controller.signal
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${text}`);
            const data = JSON.parse(text);
            if (!data.response || !data.question) throw new Error('AI endpoint returned no response/question');
            if (data.source === 'fallback' || data.source === 'offline') throw new Error(`Live AI provider was not used (source=${data.source})`);
            console.log('CALLCONSOLE AI smoke test passed:', JSON.stringify({ source: data.source, model: data.model || null }));
          } finally {
            clearTimeout(timer);
          }
          NODE

      - name: Smoke test AI script tailoring
        run: |
          node - <<'NODE'
          const endpoint = 'https://intelligent-outreach-builder.vercel.app/api/callconsole-ai';
          const payload = {task:'script_tailoring',prospect:'Smoke Test Prospect',company:'Smoke Test Co',role:'Business Transformation Director',department:'Transformation',product:'Jedox',research:'Test-only research. Role is not a standard finance title; keep claims cautious.',localScript:'Hi, may I take 30 seconds to understand how your team currently handles planning and reporting?'};
          const response = await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
          const text = await response.text();
          if(!response.ok) throw new Error(`HTTP ${response.status}: ${text}`);
          const data=JSON.parse(text);
          if(!data.script) throw new Error('AI tailoring returned no script');
          if(data.source==='fallback') throw new Error('Live AI tailoring provider was not used');
          if(!Array.isArray(data.discoveryQuestions)||data.discoveryQuestions.length<3) throw new Error('AI tailoring returned fewer than 3 discovery questions');
          if(!data.positioning) throw new Error('AI tailoring returned no positioning');
          console.log('CALLCONSOLE AI script tailoring smoke test passed:',JSON.stringify({source:data.source,model:data.model||null,confidence:data.confidence||null,roleLens:data.roleLens||null}));
          NODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CALLCONSOLE-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30