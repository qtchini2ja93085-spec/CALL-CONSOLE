name: Build CALLCONSOLE Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CALLCONSOLE web app
        run: |
          # Preferred source: app files committed directly to www/
          if [ -f www/index.html ]; then
            echo "Using CALLCONSOLE files committed directly to www/"
          elif [ -f CALLCONSOLE-ANDROID-CAPACITOR-PROJECT.zip ]; then
            echo "No direct www/index.html found; restoring from project ZIP"
            rm -rf /tmp/callconsole www
            mkdir -p /tmp/callconsole
            unzip -q CALLCONSOLE-ANDROID-CAPACITOR-PROJECT.zip -d /tmp/callconsole
            SOURCE_DIR="$(find /tmp/callconsole -type f -path '*/www/index.html' -print -quit | xargs dirname)"
            if [ -z "$SOURCE_DIR" ]; then
              echo "Could not find www/index.html inside CALLCONSOLE-ANDROID-CAPACITOR-PROJECT.zip"
              exit 1
            fi
            cp -R "$SOURCE_DIR" www
          else
            echo "No CALLCONSOLE web app source found."
            exit 1
          fi
          test -f www/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CALLCONSOLE-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
