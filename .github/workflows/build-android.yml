name: Build CALLCONSOLE Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore known-good CALLCONSOLE baseline
        run: |
          set -e
          rm -rf /tmp/callconsole www
          mkdir -p /tmp/callconsole
          unzip -q CALLCONSOLE-ANDROID-CAPACITOR-PROJECT.zip -d /tmp/callconsole
          SOURCE_DIR="$(find /tmp/callconsole -type f -path '*/www/index.html' -print -quit | xargs dirname)"
          test -n "$SOURCE_DIR"
          cp -R "$SOURCE_DIR" www
          test -f www/index.html

      - name: Apply AI engine and CALLCONSOLE coach integration
        run: |
          set -e
          test -f build-assets/callconsole-ai-engine.js
          cp build-assets/callconsole-ai-engine.js www/ai-engine.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'function coachNextMove(){'
          if old not in s:
              raise SystemExit('Expected CALLCONSOLE coach function was not found')
          s = s.replace(old, 'function coachNextMoveLocal(){', 1)
          marker = '<!-- V22 End-to-End QA: context-aware Coach, workflow duration, CRM sync, quick-outcome state fixes -->'
          if marker not in s:
              raise SystemExit('Expected CALLCONSOLE injection marker was not found')
          inject = '''<script src="./ai-engine.js"></script>
<style id="callconsole-aero-script-modes">
#aero-script-modes{margin:12px 0;padding:12px;border:1px solid rgba(127,127,127,.25);border-radius:14px;background:rgba(127,127,127,.06)}
#aero-script-modes .aero-title{font-weight:800;margin-bottom:8px}#aero-script-modes .aero-sub{font-size:12px;opacity:.72;margin-bottom:9px}
#aero-script-modes .aero-btns{display:flex;gap:7px;flex-wrap:wrap}#aero-script-modes button{border:1px solid rgba(127,127,127,.35);border-radius:10px;padding:8px 11px;background:transparent;color:inherit;font-weight:700;cursor:pointer}
#aero-script-modes button.active{box-shadow:0 0 0 2px rgba(80,160,255,.25);font-weight:900}#aero-script-status{margin-top:9px;font-size:12px;font-weight:700}
#aero-ai-script{display:none;margin-top:10px;padding:12px;border-radius:12px;border:1px solid rgba(80,160,255,.35);background:rgba(80,160,255,.06)}
#aero-ai-script.open{display:block}.aero-ai-label{font-size:11px;font-weight:900;letter-spacing:.04em}.aero-ai-script-text{white-space:pre-wrap;line-height:1.5;margin-top:7px}.aero-ai-meta{margin-top:8px;font-size:12px;opacity:.78}.aero-ai-q{margin-top:8px}.aero-ai-q strong{display:block;margin-bottom:3px}
</style>
<script>
(function(){
  const endpoint=(window.CALLCONSOLE_AI_CONFIG&&window.CALLCONSOLE_AI_CONFIG.endpoint)||'https://intelligent-outreach-builder.vercel.app/api/callconsole-ai';
  const $=(s)=>document.querySelector(s);
  const val=(ids)=>{for(const id of ids){const e=document.getElementById(id);if(e){const v=('value' in e?e.value:e.textContent||'').trim();if(v)return v;}}return '';};
  function localScript(){
    const selectors=['#script-output','#generated-script','#call-script','#talk-track','#scriptText','#script-text','textarea[id*="script" i]','[contenteditable="true"][id*="script" i]'];
    for(const sel of selectors){const e=$(sel);if(e){const v=('value' in e?e.value:e.innerText||e.textContent||'').trim();if(v.length>80)return v;}}
    const candidates=[...document.querySelectorAll('textarea,[contenteditable="true"]')].map(e=>('value' in e?e.value:e.innerText||e.textContent||'').trim()).filter(v=>v.length>120);
    return candidates.sort((a,b)=>b.length-a.length)[0]||'';
  }
  function context(){return {prospect:val(['f-prospect','prospect','prospect-name']),company:val(['f-company','company','company-name']),role:val(['f-role','role','role-input']),department:val(['f-department','department','department-input','function','function-input']),product:val(['f-product','product'])||'Jedox',research:val(['f-research','research','research-notes']),localScript:localScript()};}
  function roleUncertain(c){const r=c.role.toLowerCase(),d=c.department.toLowerCase(),x=c.research.toLowerCase();return !r||!d||r.length<4||/unknown|unclear|unsure|maybe|might|probably|appears|possibly/.test(r+' '+d+' '+x)||/transformation|operations|strategy|enablement|excellence|business partner|program|portfolio/.test(r)&&!/(cfo|controller|fp&a|finance|it|cio|hr|human resources|sales|marketing|supply chain|procurement|treasury|accounting)/.test(r+' '+d);}
  function add(){
    if(document.getElementById('aero-script-modes'))return;
    const anchor=document.querySelector('#script-output,#generated-script,#call-script,#talk-track')||document.querySelector('[id*="script" i]');
    const host=document.createElement('div');host.id='aero-script-modes';
    host.innerHTML='<div class="aero-title">SCRIPT INTELLIGENCE</div><div class="aero-sub">Keep the proven local script, or explicitly ask AI to tailor a separate version. AI never overwrites the local script.</div><div class="aero-btns"><button type="button" data-mode="auto">⚡ AUTO / SMART</button><button type="button" data-mode="ai">🧠 AI TAILOR</button><button type="button" data-mode="local">📄 ORIGINAL / LOCAL</button></div><div id="aero-script-status">⚡ Auto mode ready.</div><div id="aero-ai-script"><div class="aero-ai-label">🧠 AI TAILORED SCRIPT</div><div id="aero-ai-script-text" class="aero-ai-script-text"></div><div id="aero-ai-meta" class="aero-ai-meta"></div><div id="aero-ai-qs" class="aero-ai-q"></div></div>';
    if(anchor&&anchor.parentNode)anchor.parentNode.insertBefore(host,anchor);else(document.querySelector('main')||document.body).appendChild(host);
    host.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>run(b.dataset.mode)));
    setMode('auto');
  }
  function setMode(mode){const box=$('#aero-script-modes');if(!box)return;box.querySelectorAll('button[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));}
  function status(t){const e=$('#aero-script-status');if(e)e.textContent=t;}
  async function run(mode){
    const c=context();setMode(mode);
    if(mode==='local'){status('📄 ORIGINAL / LOCAL ACTIVE — using the proven CALLCONSOLE script engine.');$('#aero-ai-script')?.classList.remove('open');return;}
    if(mode==='auto'){
      if(roleUncertain(c)){status('⚡ AUTO selected 🧠 AI TAILOR — role/function or research is uncertain/complex.');return run('ai');}
      status('⚡ AUTO selected 📄 ORIGINAL / LOCAL — enough reliable context for deterministic tailoring.');$('#aero-ai-script')?.classList.remove('open');return;
    }
    status('🧠 AI TAILORING…');
    const out=$('#aero-ai-script');if(out)out.classList.add('open');
    try{
      const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...c,task:'script_tailoring'})});
      const d=await r.json();
      if(!d||!d.script)throw new Error('No tailored script returned');
      $('#aero-ai-script-text').textContent=d.script;
      $('#aero-ai-meta').textContent=`${d.source==='gemini'?'🧠 AI TAILORED':'⚡ LOCAL FALLBACK'} • Confidence: ${d.confidence||'unknown'} • ${d.reason||'Evidence-based tailoring'}`;
      $('#aero-ai-qs').innerHTML='<strong>Suggested discovery questions</strong>'+(Array.isArray(d.discoveryQuestions)?d.discoveryQuestions.map(q=>`<div>• ${String(q).replace(/</g,'&lt;')}</div>`).join(''):'');
      status(d.source==='gemini'?'🧠 AI TAILORING APPLIED — separate AI version generated.':'⚡ AI unavailable — local script preserved.');
    }catch(e){status('⚠️ AI tailoring failed — ORIGINAL / LOCAL remains available.');}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
  new MutationObserver(()=>{if(!document.getElementById('aero-script-modes'))add();}).observe(document.body,{childList:true,subtree:true});
})();

async function coachNextMove(){
    const input=document.getElementById("live-coach-input");
    const text=input?input.value.trim():"";
    if(!text){showStatus("⚡ Enter what the prospect said first.");return;}
    const research=((document.getElementById("f-research")||{}).value||"");
    const role=((document.getElementById("f-role")||{}).value||"the team").trim();
    const company=((document.getElementById("f-company")||{}).value||"").trim();
    const prospect=((document.getElementById("f-prospect")||{}).value||"").trim();
    const product=((document.getElementById("f-product")||{}).value||"Jedox").trim();
    const ctx={prospect,company,role,product,research,prospectSaid:text};
    const result=await window.CALLCONSOLE_AI.nextMove({...ctx,localFallback:()=>window.CALLCONSOLE_AI.localNextMove(ctx)});
    const rEl=document.getElementById("live-coach-response");if(rEl)rEl.textContent=result.response;
    const qEl=document.getElementById("live-coach-question");if(qEl)qEl.textContent=result.question;
    const resEl=document.getElementById("live-coach-result");if(resEl)resEl.classList.add("open");
    showStatus(result.source!=="offline"?"🧠 AI coaching applied.":"⚡ Offline coaching applied.");
}
</script>

'''
          s=s.replace(marker,inject+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check www/ai-engine.js
          node --check /dev/stdin <<'NODE'
          // Validate the newly injected JS separately.
          const fs=require('fs'); const s=fs.readFileSync('www/index.html','utf8');
          if(!s.includes('SCRIPT INTELLIGENCE')||!s.includes('task:\'script_tailoring\'')) process.exit(1);
          NODE
          grep -q 'function coachNextMoveLocal' www/index.html
          grep -q 'function coachNextMove()' www/index.html
          grep -q 'CALLCONSOLE_AI.nextMove' www/index.html
          grep -q 'SCRIPT INTELLIGENCE' www/index.html
          grep -q 'AI TAILOR' www/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Smoke test live CALLCONSOLE AI endpoint
        run: |
          node - <<'NODE'
          const endpoint = 'https://intelligent-outreach-builder.vercel.app/api/callconsole-ai';
          const payload = {
            prospect: 'Smoke Test Prospect',
            company: 'Smoke Test Co',
            role: 'CFO',
            department: 'Finance',
            product: 'Jedox',
            research: 'Test-only validation request. Do not invent facts.',
            prospectSaid: 'We are interested, but we need to understand the timing.'
          };
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 30000);
          try {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
              signal: controller.signal
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${text}`);
            const data = JSON.parse(text);
            if (!data.response || !data.question) throw new Error('AI endpoint returned no response/question');
            if (data.source === 'fallback' || data.source === 'offline') throw new Error(`Live AI provider was not used (source=${data.source})`);
            console.log('CALLCONSOLE AI smoke test passed:', JSON.stringify({ source: data.source, model: data.model || null }));
          } finally {
            clearTimeout(timer);
          }
          NODE

      - name: Smoke test AI script tailoring
        run: |
          node - <<'NODE'
          const endpoint = 'https://intelligent-outreach-builder.vercel.app/api/callconsole-ai';
          const payload = {task:'script_tailoring',prospect:'Smoke Test Prospect',company:'Smoke Test Co',role:'Business Transformation Director',department:'Transformation',product:'Jedox',research:'Test-only research. Role is not a standard finance title; keep claims cautious.',localScript:'Hi, may I take 30 seconds to understand how your team currently handles planning and reporting?'};
          const response = await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
          const text = await response.text();
          if(!response.ok) throw new Error(`HTTP ${response.status}: ${text}`);
          const data=JSON.parse(text);
          if(!data.script) throw new Error('AI tailoring returned no script');
          if(data.source==='fallback') throw new Error('Live AI tailoring provider was not used');
          console.log('CALLCONSOLE AI script tailoring smoke test passed:',JSON.stringify({source:data.source,model:data.model||null,confidence:data.confidence||null}));
          NODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CALLCONSOLE-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
