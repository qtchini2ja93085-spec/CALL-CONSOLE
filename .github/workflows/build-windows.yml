name: Build CALLCONSOLE Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install

      - name: Install Tauri CLI
        shell: pwsh
        run: npm install --save-dev @tauri-apps/cli@^2

      - name: Build Windows NSIS installer
        shell: pwsh
        run: npx tauri build --bundles nsis

      - name: Locate installer
        id: locate
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installer: $($installer.FullName)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CALLCONSOLE-Windows-Installer
          path: ${{ steps.locate.outputs.installer }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: CALLCONSOLE-Windows-Executable
          path: src-tauri/target/release/callconsole.exe
          if-no-files-found: error
          retention-days: 30
